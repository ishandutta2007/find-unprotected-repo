<svg width="100%" height="100%" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#58a6ff;#238636;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#238636;#58a6ff;#238636" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 12px #58a6ff); }
    }
    @keyframes scan {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(4px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(8px) translateX(-4px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse-shield {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: 140px 210px;
    }
    .scanner-line {
      animation: scan 5s linear infinite;
    }
    .floating-card-1 {
      animation: float1 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float2 7s ease-in-out infinite;
    }
    .blinking-dot {
      animation: blink 2s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="140" cy="210" r="160" fill="url(#glow-grad)" />
  <circle cx="1060" cy="180" r="180" fill="url(#glow-grad)" opacity="0.6" />

  <!-- Scanning Sweep Effect -->
  <g class="scanner-line">
    <rect x="0" y="0" width="300" height="420" fill="url(#scan-grad)" />
    <line x1="150" y1="0" x2="150" y2="420" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Left: Animated Security Emblem / Shield -->
  <g class="pulse-shield">
    <!-- Radar ring effect -->
    <circle cx="140" cy="210" r="85" fill="none" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 140 210" to="360 140 210" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="210" r="65" fill="none" stroke="#238636" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360 140 210" to="0 140 210" dur="15s" repeatCount="indefinite" />
    </circle>

    <!-- Shield Background & Glow -->
    <circle cx="140" cy="210" r="50" fill="url(#shield-glow)" />
    <path d="M140 160 L180 180 V215 C180 242 140 262 140 262 C140 262 100 242 100 215 V180 Z" fill="#0d1117" stroke="url(#shield-grad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#soft-glow)" />

    <!-- Shield Internal Emblem (Lock + Check) -->
    <!-- Lock body & shackle -->
    <rect x="126" y="206" width="28" height="22" rx="4" fill="#58a6ff" />
    <path d="M131 206 V197 C131 192 135 188 140 188 C145 188 149 192 149 197 V206" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" />
    <!-- Glowing Keyhole -->
    <circle cx="140" cy="215" r="2.5" fill="#0d1117" />
    <path d="M140 217.5 V222" stroke="#0d1117" stroke-width="2" stroke-linecap="round" />

    <!-- Status indicator badge on shield -->
    <circle cx="172" cy="180" r="8" fill="#238636" stroke="#0d1117" stroke-width="2" />
    <path d="M168.5 180 L171 182.5 L175.5 177.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center Content: Title, Badges, Tagline -->
  <!-- Top Category / Protocol Pill -->
  <g transform="translate(250, 60)">
    <rect width="270" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#3fb950" class="blinking-dot" />
    <text x="28" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7ee787" letter-spacing="1">SECURITY AUDIT ENGINE</text>
    <rect x="200" y="5" width="60" height="18" rx="9" fill="#238636" fill-opacity="0.3" />
    <text x="230" y="17.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#3fb950">ACTIVE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(250, 130)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Find Unprotected Repos
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(250, 168)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e">
      High-performance branch protection auditor &amp; security posture scanner for GitHub.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(250, 210)">
    <!-- Pill 1: 25h Caching -->
    <g transform="translate(0, 0)">
      <rect width="155" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">⚡ 25h Local Cache</text>
    </g>
    <!-- Pill 2: Fork Filtering -->
    <g transform="translate(165, 0)">
      <rect width="145" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">🍴 Fork Filtering</text>
    </g>
    <!-- Pill 3: Deep Scan -->
    <g transform="translate(320, 0)">
      <rect width="135" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">🔍 Deep Audit</text>
    </g>
    <!-- Pill 4: CLI + Web UI -->
    <g transform="translate(465, 0)">
      <rect width="145" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">📟 CLI + Web UI</text>
    </g>
  </g>

  <!-- Bottom Command Snippet Bar -->
  <g transform="translate(250, 275)">
    <rect width="470" height="42" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="16" y="26" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14" fill="#79c0ff">$</text>
    <text x="32" y="26" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14" fill="#e6edf3">python find_unprotected_repos.py</text>
    <text x="365" y="26" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#56d364">--fast</text>
  </g>

  <!-- Right Side: Live Mock Security Audit Cards -->
  <!-- Card 1: Protected Branch (Floating 1) -->
  <g class="floating-card-1" transform="translate(860, 70)">
    <rect width="300" height="110" rx="10" fill="url(#card-grad)" stroke="#238636" stroke-width="1.5" filter="url(#soft-glow)" />
    <!-- Header -->
    <circle cx="24" cy="28" r="7" fill="#238636" />
    <path d="M21 28 L23.5 30.5 L27 26" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e6edf3">repo/production-api</text>
    
    <line x1="16" y1="48" x2="284" y2="48" stroke="#30363d" stroke-width="1" />
    
    <!-- Branch Details -->
    <text x="24" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">branch: <tspan fill="#58a6ff">main</tspan></text>
    <rect x="200" y="58" width="80" height="20" rx="4" fill="#238636" fill-opacity="0.25" />
    <text x="240" y="72.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#3fb950">PROTECTED</text>
    
    <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#7ee787">✓ Required Reviews &amp; PR Enforced</text>
  </g>

  <!-- Card 2: Unprotected Alert Branch (Floating 2) -->
  <g class="floating-card-2" transform="translate(860, 205)">
    <rect width="300" height="110" rx="10" fill="url(#card-grad)" stroke="#f85149" stroke-width="1.5" filter="url(#soft-glow)" />
    <!-- Header -->
    <circle cx="24" cy="28" r="7" fill="#da3633" class="blinking-dot" />
    <path d="M24 24 V29 M24 32 V33" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e6edf3">repo/internal-tooling</text>
    
    <line x1="16" y1="48" x2="284" y2="48" stroke="#30363d" stroke-width="1" />
    
    <!-- Branch Details -->
    <text x="24" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">branch: <tspan fill="#f0883e">master</tspan></text>
    <rect x="186" y="58" width="94" height="20" rx="4" fill="#da3633" fill-opacity="0.25" />
    <text x="233" y="72.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ff7b72">UNPROTECTED</text>
    
    <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#ff7b72">⚠ Direct push allowed • Audit alert</text>
  </g>

  <!-- Floating Particles / Nodes -->
  <circle cx="830" cy="50" r="3" fill="#58a6ff" opacity="0.6">
    <animate attributeName="cy" values="50;40;50" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1170" cy="340" r="2.5" fill="#3fb950" opacity="0.5">
    <animate attributeName="cy" values="340;350;340" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="790" cy="360" r="3" fill="#79c0ff" opacity="0.4">
    <animate attributeName="cx" values="790;800;790" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>

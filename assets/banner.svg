<svg width="100%" height="100%" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#141a23" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#238636;#1f6feb;#58a6ff" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#238636">
        <animate attributeName="stop-color" values="#238636;#58a6ff;#238636" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <!-- Laser Scanner Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="center-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 14px #58a6ff); }
    }
    @keyframes sweep {
      0% { transform: translateX(-1000px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .scanner {
      animation: sweep 5s linear infinite;
    }
    .shield-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: 500px 58px;
    }
    .blinking {
      animation: blink 2s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="340" rx="14" fill="url(#bg-grad)" />
  <rect width="1000" height="340" rx="14" fill="url(#grid)" />

  <!-- Ambient Center Glow -->
  <circle cx="500" cy="150" r="280" fill="url(#center-glow)" />

  <!-- Scanning Sweep Laser -->
  <g class="scanner">
    <rect x="0" y="0" width="240" height="340" fill="url(#scan-grad)" />
    <line x1="120" y1="0" x2="120" y2="340" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Glowing Outer Border -->
  <rect x="1.5" y="1.5" width="997" height="337" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Top Center: Shield Emblem with Radar Pulse -->
  <g class="shield-pulse">
    <!-- Rotating radar ring -->
    <circle cx="500" cy="58" r="38" fill="none" stroke="#1f6feb" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 500 58" to="360 500 58" dur="16s" repeatCount="indefinite" />
    </circle>
    
    <!-- Shield Path -->
    <path d="M500 32 L524 44 V65 C524 81 500 93 500 93 C500 93 476 81 476 65 V44 Z" fill="#0d1117" stroke="url(#shield-grad)" stroke-width="2.8" stroke-linejoin="round" filter="url(#soft-glow)" />

    <!-- Lock Emblem -->
    <rect x="492" y="58" width="16" height="13" rx="2" fill="#58a6ff" />
    <path d="M495 58 V52 C495 49.5 497.2 47.5 500 47.5 C502.8 47.5 505 49.5 505 52 V58" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" />
    <circle cx="500" cy="63.5" r="1.5" fill="#0d1117" />
    <path d="M500 65 V67.5" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round" />

    <!-- Active Shield Green Checkpoint -->
    <circle cx="518" cy="44" r="5" fill="#238636" stroke="#0d1117" stroke-width="1.5" />
    <path d="M516 44 L517.5 45.5 L520.5 42" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Status Pill (Centered) -->
  <g transform="translate(375, 108)">
    <rect width="250" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#3fb950" class="blinking" />
    <text x="24" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7ee787" letter-spacing="1">SECURITY AUDIT ENGINE</text>
    <rect x="184" y="3" width="58" height="18" rx="9" fill="#238636" fill-opacity="0.3" />
    <text x="213" y="15.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#3fb950">ACTIVE</text>
  </g>

  <!-- Main Title (Centered) -->
  <text x="500" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
    Find Unprotected Repos
  </text>

  <!-- Subtitle (Centered) -->
  <text x="500" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e">
    Automate GitHub branch protection audits &amp; repository security posture scanner in seconds.
  </text>

  <!-- Feature Pills Row (Centered: total width 580, starts at x = 210) -->
  <g transform="translate(210, 224)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#e6edf3">⚡ 25h Cache</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(142, 0)">
      <rect width="135" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="67.5" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#e6edf3">🍴 Fork Filtering</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(289, 0)">
      <rect width="135" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="67.5" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#e6edf3">🔍 Deep Audit</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(436, 0)">
      <rect width="144" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="72" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#e6edf3">📟 CLI + Web UI</text>
    </g>
  </g>

  <!-- Interactive Terminal Snippet Bar (Centered: width 480, starts at x = 260) -->
  <g transform="translate(260, 270)">
    <rect width="480" height="38" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="20" y="24" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#79c0ff">$</text>
    <text x="36" y="24" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#e6edf3">python find_unprotected_repos.py</text>
    <text x="390" y="24" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" fill="#56d364">--fast</text>
  </g>

  <!-- Ambient Floating Data Nodes -->
  <g class="particle">
    <circle cx="120" cy="110" r="3" fill="#58a6ff" opacity="0.6" />
    <circle cx="150" cy="230" r="2" fill="#3fb950" opacity="0.5" />
    <circle cx="880" cy="110" r="3" fill="#58a6ff" opacity="0.6" />
    <circle cx="850" cy="230" r="2" fill="#3fb950" opacity="0.5" />
  </g>
</svg>
